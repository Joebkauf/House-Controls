<title>House Controls</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a TV-guide wall. Left rail = which TV + what's on; centre = channel
   tiles under category tabs; right pad = the few buttons a remote really needs.
   Dark-first (it is used on a couch with the lights down); light theme for daytime. */
:root {
  --bg: #121820;          /* night slate */
  --panel: #1a2230;       /* rail + pad */
  --tile: #222c3b;        /* channel tile */
  --tile-hi: #2b3748;     /* pressed / hover */
  --line: #2f3b4d;
  --fg: #f3efe7;          /* warm off-white */
  --muted: #9aa6b8;
  --accent: #f0b35a;      /* amber: what is on, what is live */
  --accent-ink: #1a1408;
  --ok: #58c28a;
  --warn: #e8a042;
  --bad: #e5655f;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ece9e2; --panel: #f7f5f0; --tile: #ffffff; --tile-hi: #f1ede4; --line: #d8d3c8;
    --fg: #1c2230; --muted: #5d6676; --accent: #b8741a; --accent-ink: #fff8ec;
    --ok: #2f9a63; --warn: #b96f12; --bad: #c4443f; --shadow: 0 8px 24px rgba(40,30,10,.12);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #ece9e2; --panel: #f7f5f0; --tile: #ffffff; --tile-hi: #f1ede4; --line: #d8d3c8;
  --fg: #1c2230; --muted: #5d6676; --accent: #b8741a; --accent-ink: #fff8ec;
  --ok: #2f9a63; --warn: #b96f12; --bad: #c4443f; --shadow: 0 8px 24px rgba(40,30,10,.12);
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.35 var(--body);
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.app { height: 100%; display: grid; gap: 14px; grid-template-columns: 180px minmax(0,1fr) 230px; grid-template-rows: minmax(0,1fr); }

/* rail */
.rail { background: var(--panel); border-radius: 18px; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.brand { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.brand small { font: 500 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.boxes { display: flex; flex-direction: column; gap: 6px; }
.box { text-align: left; border-radius: 12px; padding: 10px 12px; border: 1px solid transparent; display: grid; gap: 3px; }
.box.on { background: var(--tile); border-color: var(--line); }
.box .nm { font-family: var(--display); font-size: 19px; font-weight: 600; }
.box .st { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.box .st > span, .box .st { overflow: hidden; }
.box .onph { display: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ready { background: var(--ok); } .dot.pairing, .dot.connecting { background: var(--warn); } .dot.offline, .dot.needs-pairing { background: var(--bad); }
.now { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; }
.now .lbl, .lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.now .big { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1.05; }
.now .sub { color: var(--muted); font-size: 13px; }
.rail .gear { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 6px 0; display: flex; gap: 6px; align-items: center; }
.rail .gear:hover { color: var(--fg); }

/* centre */
.main { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
.tabs { display: flex; gap: 4px; align-items: center; overflow-x: auto; scrollbar-width: none; flex: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 10px 14px; border-radius: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; color: var(--muted); white-space: nowrap; }
.tab.on { color: var(--fg); background: var(--panel); box-shadow: inset 0 -3px 0 var(--accent); }
.tabs .sp { flex: 1; }
.tab.edit { color: var(--accent); }
.tab.edit.on { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.grid { overflow-y: auto; display: grid; grid-auto-rows: max-content; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 12px; align-content: start; padding: 2px 2px 8px; min-height: 0; }
.tile { position: relative; background: var(--tile); border-radius: 16px; min-height: 88px; padding: 12px 14px 11px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; text-align: left; box-shadow: var(--shadow); border: 2px solid transparent; transition: transform .08s ease, background .08s ease; }
.tile:active { transform: scale(.97); background: var(--tile-hi); }
.tile.live { border-color: var(--accent); }
/* one line on top: logo · name · CH number (the ☆ sits in the corner); one line under it: what's on */
.tile .top { display: flex; align-items: center; gap: 8px; min-width: 0; padding-right: 30px; }
.tile .name { font-family: var(--display); font-weight: 700; font-size: clamp(17px, 1.7vw, 22px); line-height: 1.1; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tile .top .num { margin-left: auto; white-space: nowrap; flex: none; }
.tile .top .logo { flex: none; }
.tile .show { font-size: 13.5px; line-height: 1.3; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-width: 0; }
.tile .show.tag { color: var(--muted); font-size: 12px; }
.tile .show .chn { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--fg); font-variant-numeric: tabular-nums; margin-right: 8px; white-space: nowrap; }
.tile .show .chn.none { color: var(--warn); font-family: var(--body); font-size: 11px; }
.tile .show .lb { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
.tile .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile.branded { background: linear-gradient(140deg, color-mix(in srgb, var(--bc) 30%, var(--tile)) 0%, var(--tile) 75%); box-shadow: inset 0 3px 0 var(--bc), var(--shadow); }
.tile .chip { display: flex; align-items: center; gap: 7px; min-width: 0; }
.tile .logo { width: 22px; height: 22px; border-radius: 5px; flex: none; }
.tile .logowrap { display: inline-flex; flex: none; }
.tile .logo.mono { display: inline-grid; place-items: center; background: var(--bc, var(--muted)); color: #fff; font-family: var(--display); font-weight: 700; font-size: 10px; letter-spacing: .02em; }
.tile .name.long { font-size: clamp(15px, 1.35vw, 18px); }
.tile.apptile .logo { width: 26px; height: 26px; }
.tile .num { font-family: var(--display); font-size: 15px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile .num.none { color: var(--warn); font-family: var(--body); font-size: 11px; font-weight: 600; }
.tile .onnow { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.tile .fav { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; line-height: 34px; text-align: center; color: var(--muted); }
.tile .fav.on { color: var(--accent); }
.tile.editing { cursor: default; }
.tile.editing input { width: 100%; box-sizing: border-box; font-size: 16px; }
.tile.editing .row { display: grid; grid-template-columns: 1fr 72px; gap: 6px; }
.tile.editing .del { color: var(--bad); font-size: 12px; font-weight: 600; justify-self: start; }
.tile.apptile { min-height: 84px; }
.tile.apptile .top { padding-right: 0; }
.tile.apptile .name { font-size: clamp(18px, 1.9vw, 24px); }
.tile.apptile .meta .num { font-family: var(--body); font-size: 12px; font-weight: 600; }
.tile.apptile.na { opacity: .45; }
.tile.add { place-items: center; border: 2px dashed var(--line); background: transparent; box-shadow: none; color: var(--muted); font-weight: 600; }
.empty { color: var(--muted); padding: 30px 8px; grid-column: 1 / -1; }
.log { background: var(--bg); border-radius: 10px; padding: 10px; font: 11px/1.4 ui-monospace, Menlo, monospace; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.stack.dvr { display: grid; gap: 8px; }
.k.rec { color: var(--bad); font-weight: 700; }
.tile.plug .pw { font-size: 20px; color: var(--muted); } .tile.plug .pw.on { color: var(--ok); }
.tile.plug .plugico { font-size: 14px; background: var(--panel); color: var(--fg); }
.tile.plug.live { border-color: var(--ok); }
.grid:has(.stat) { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.tile.stat { cursor: default; gap: 10px; justify-content: flex-start; }
.tile.stat .top { padding-right: 0; }
.tile.stat .word { margin-left: auto; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.tile.stat.heating .word { color: var(--warn); } .tile.stat.cooling .word { color: #3b82c4; } .tile.stat.down .word { color: var(--bad); }
.stbody { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; }
.stcur { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.stbig { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.stcur .lbl { font-size: 10.5px; white-space: nowrap; }
.stset { display: grid; gap: 6px; }
.stset .row { display: flex; align-items: center; gap: 8px; }
.stset .row .lbl { width: 64px; flex: none; }
.stset .pm { width: 44px; height: 40px; border-radius: 10px; background: var(--bg); font-size: 24px; font-weight: 700; line-height: 1; }
.stset .pm:active { background: var(--tile-hi); }
.stset .stval { font-family: var(--display); font-weight: 700; font-size: 24px; min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
.stset .stval small { font-size: 12px; font-weight: 600; color: var(--muted); font-family: var(--body); display: block; }
.strow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.strow .seg button { padding: 6px 10px; }
.strow .lnk { color: var(--accent); font-weight: 600; font-size: 12.5px; padding: 4px 0; }
.tile.stat.down { opacity: .7; } .tile.stat .why { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
.k.sleep { min-height: 48px; font-weight: 600; font-size: 14px; background: color-mix(in srgb, var(--accent) 14%, var(--tile)); }
.k.sleep.on { background: var(--accent); color: var(--accent-ink); }
#sleepQuick { display: none; }
@media (max-width: 640px) { #sleepQuick { display: block; width: 100%; margin-top: 6px; } #sleepQuick[hidden] { display: none; } }
.vol.hp .row2 .k { min-height: 46px; }
.apppanel { grid-column: 1 / -1; background: var(--panel); border-radius: 16px; padding: 12px 14px; display: grid; gap: 10px; box-shadow: var(--shadow); }
.aphead { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; } .aphead .st { color: var(--muted); font-size: 13px; }
.apbody { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.apppanel .dpad { display: grid; grid-template-columns: repeat(3, 62px); grid-auto-rows: 54px; gap: 6px; }
.apppanel .dpad .k { font-size: 22px; } .apppanel .dpad .k.ok { font-weight: 700; font-size: 17px; }
.apkeys { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; } .apkeys .k { min-height: 50px; font-size: 15px; }
@media (max-width: 640px) { .apbody { grid-template-columns: 1fr; justify-items: center; } .apppanel .dpad { grid-template-columns: repeat(3, 72px); grid-auto-rows: 58px; } .apkeys { width: 100%; grid-template-columns: repeat(3, 1fr); } }
.people { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 2px 2px 0; }
.people.lbl { padding-top: 6px; }
.pchip { padding: 9px 14px; border-radius: 999px; background: var(--tile); font-weight: 600; font-size: 14px; box-shadow: var(--shadow); }
.pchip.on { background: var(--accent); color: var(--accent-ink); }
.pchip.add { background: transparent; border: 2px dashed var(--line); box-shadow: none; color: var(--muted); }
.pchip.del { color: var(--bad); }
.inl { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.inl input { font-size: 16px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); min-width: 160px; }
.tile.add.inl { place-items: stretch; display: grid; gap: 8px; }
.tile.showtile .name { font-size: clamp(17px, 1.7vw, 22px); }
/* guide */
.grid:has(.guide) { display: block; padding: 0; }
.guide { --gch: 150px; position: relative; overflow: auto; max-height: 100%; background: var(--panel); border-radius: 16px; }
.grow { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); min-height: 52px; }
.grow.live .gch { box-shadow: inset 4px 0 0 var(--accent); }
.gch { position: sticky; left: 0; z-index: 2; width: var(--gch); flex: none; background: var(--panel); display: grid; grid-template-columns: 24px 1fr auto; grid-template-rows: auto auto; column-gap: 6px; align-items: center; padding: 6px 8px; text-align: left; border-right: 1px solid var(--line); border-left: 4px solid var(--bc, transparent); }
.gch .logowrap { grid-row: 1 / 3; } .gch .logo { width: 22px; height: 22px; }
.gch .gname { font-family: var(--display); font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gch .gnum { grid-column: 2; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gch .gstar { grid-column: 3; grid-row: 1; color: var(--accent); font-size: 14px; }
.gch.lbl { display: block; padding: 10px 8px; font-size: 11px; }
.gprogs { position: relative; flex: none; }
.gprog { position: absolute; top: 5px; bottom: 5px; background: var(--tile); border-radius: 8px; padding: 4px 8px; text-align: left; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 1px; box-shadow: var(--shadow); font-size: 13px; line-height: 1.15; }
.gprog span { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.gprog small { color: var(--muted); font-size: 11px; }
.gprog.on { background: color-mix(in srgb, var(--accent) 18%, var(--tile)); box-shadow: inset 0 0 0 2px var(--accent); font-weight: 600; }
.ghead { position: sticky; top: 0; z-index: 3; background: var(--panel); min-height: 36px; border-bottom: 2px solid var(--line); }
.ghead .gch { z-index: 4; }
.gticks { height: 36px; }
.gtick { position: absolute; top: 10px; font-size: 12px; color: var(--muted); border-left: 1px solid var(--line); padding-left: 6px; height: 26px; }
.gnow { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 1; pointer-events: none; }
@media (max-width: 640px) { .guide { --gch: 112px; } .gch { grid-template-columns: 18px 1fr auto; } .gch .logo { width: 18px; height: 18px; } .gch .gname { font-size: 13px; } }

/* pad */
.pad { background: var(--panel); border-radius: 18px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; overflow-y: auto; }
.k { background: var(--tile); border-radius: 14px; min-height: 56px; display: grid; place-items: center; font-weight: 600; font-size: 15px; letter-spacing: .04em; box-shadow: var(--shadow); transition: transform .06s ease, background .06s ease; }
.k:active { transform: scale(.95); background: var(--tile-hi); }
.k.big { min-height: 70px; font-size: 26px; font-family: var(--display); font-weight: 700; }
.k.power { background: var(--accent); color: var(--accent-ink); }
.k.mute.on { box-shadow: inset 0 0 0 2px var(--bad); }
.k.muted-word { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.vol { display: grid; gap: 6px; }
.vol .hdr { display: flex; justify-content: space-between; align-items: baseline; }
.vol .lvl { font-family: var(--display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.vol .bar { height: 10px; border-radius: 5px; background: var(--bg); overflow: hidden; }
.vol .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s ease; }
.vol .bar.muted i { background: var(--bad); }
.vol .note { font-size: 12px; color: var(--muted); }
.k.art { font-size: 14px; }
.quick { display: none; }
.pad .closePad { display: none; }
.stack { display: grid; gap: 6px; }
.stack .lbl { padding-left: 2px; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad .k { min-height: 52px; font-family: var(--display); font-size: 24px; font-weight: 700; }
.keypad .k.go { background: var(--accent); color: var(--accent-ink); font-family: var(--body); font-size: 14px; }
.dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dpad .k { min-height: 52px; font-size: 20px; }
.dpad .blank { visibility: hidden; }
.entry { font-family: var(--display); font-size: 24px; font-weight: 700; min-height: 28px; text-align: center; color: var(--accent); font-variant-numeric: tabular-nums; }

/* sheets */
.sheet { position: fixed; inset: 0; background: rgba(8,12,18,.6); display: grid; place-items: center; padding: 16px; z-index: 20; }
.sheet > div { background: var(--panel); border-radius: 18px; padding: 20px; width: min(560px, 100%); max-height: 90%; overflow-y: auto; display: grid; gap: 14px; box-shadow: var(--shadow); box-sizing: border-box; zoom: 1.4; }
@media (max-width: 900px) { .sheet > div { zoom: 1.15; } }
@media (max-width: 640px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .tile { padding: 10px 11px 10px; min-height: 80px; }
  .tile .top { gap: 6px; padding-right: 24px; }
  .tile .name { font-size: 16px; } .tile .show .chn { font-size: 13px; } .tile .logo { width: 18px; height: 18px; }
  .tile .fav { top: 4px; right: 4px; width: 30px; height: 30px; line-height: 30px; font-size: 16px; }
  .tile .show { font-size: 12.5px; } .sheet > div { zoom: 1; } }
.idpanel { background: var(--bg); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.idpanel .big { font-family: var(--display); font-size: 22px; font-weight: 700; }
.idlist { display: grid; gap: 4px; font-size: 14px; }
.idlist .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.idlist .row.pick { background: var(--tile); border-radius: 10px; padding: 8px 10px; box-shadow: var(--shadow); }
.idlist .row .btn { padding: 6px 10px; font-size: 13px; }
.idlist .st { color: var(--muted); font-size: 13px; }
.idlist .st.ok { color: var(--ok); font-weight: 600; }
.sheet h2 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 700; }
.sheet h3 { margin: 10px 0 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sheet p { margin: 0; color: var(--muted); max-width: 60ch; }
.sheet .boxrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.sheet .boxrow .nm { font-weight: 600; } .sheet .boxrow .ip { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.sheet .boxrow .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.btn { background: var(--tile); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.formrow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
.code { font-family: var(--display); font-size: 34px; letter-spacing: .25em; text-align: center; text-transform: uppercase; }
.err { color: var(--bad); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); box-sizing: border-box; }

      <div id="statRows">${(state.thermostats || []).map((t) => `<div class="formrow" style="grid-template-columns:1fr 1fr auto" data-statrow data-id="${esc(t.id)}"><input class="stName" value="${esc(t.name)}" placeholder="Name (Bedroom Level)" autocomplete="off"><input class="stHost" value="${esc(t.host)}" placeholder="Address (192.168.1.40)" autocomplete="off" inputmode="decimal"><span class="lbl" style="align-self:center;white-space:nowrap">${t.status === 'ok' ? `${t.temp != null ? `${t.temp}° · ` : ''}connected` : t.status === 'connecting' ? 'connecting…' : /refused/.test(t.error || '') ? 'refused · set Automation' : 'not answering'}</span></div>`).join('')}
        <div class="formrow" style="grid-template-columns:1fr 1fr auto" data-statrow><input class="stName" placeholder="Name (Bedroom Level)" autocomplete="off"><input class="stHost" placeholder="Address (192.168.1.40)" autocomplete="off" inputmode="decimal"><span class="lbl" style="align-self:center">new</span></div>
      </div>
      <div class="row2"><button class="btn" id="statScan" type="button">Find thermostats on the Wi-Fi</button><button class="btn pri" id="statSave" type="button">Save thermostats</button></div>
      <div id="statScanOut" class="lbl"></div>
    </div>
    <div class="idpanel" id="sdCard">
      <div class="big">TV listings</div>
      ${(() => { const sd = (state.guide && state.guide.sd) || {}; const when = sd.through ? new Date(sd.through).toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' }) : '';
        if (!sd.configured) return `<p>The guide, "On now" and the show finder run on a free feed that lists first-run episodes only, so reruns and movies are missing. Schedules Direct (schedulesdirect.org, $35 a year, 7-day trial) is the full grid for the real Optimum lineup. Open the account there, then sign in here.</p>
          <div class="formrow" style="grid-template-columns:1fr 1fr auto"><input id="sdUser" placeholder="Schedules Direct username" autocomplete="off"><input id="sdPass" type="password" placeholder="Password" autocomplete="off"><button class="btn pri" id="sdSignin" type="button">Sign in</button></div>`;
        if (!sd.lineup) return `<p>Signed in as <b>${esc(sd.username)}</b>. Now pick the lineup: the cable company and town the box is on.</p>
          <div class="formrow" style="grid-template-columns:1fr auto auto"><input id="sdZip" placeholder="Zip code" value="07656" inputmode="numeric" autocomplete="off"><button class="btn" id="sdFind" type="button">Find lineups</button><button class="btn danger" id="sdForget" type="button">Sign out</button></div>
          ${sdLineups ? `<div class="idlist">${sdLineups.length ? sdLineups.map((l) => `<div class="row pick"><span>${esc(l.name)} <span class="st">${esc(l.transport || '')}</span></span><button class="btn pri" type="button" data-sdlineup="${esc(l.id)}" data-sdname="${esc(l.name)}">Use this one</button></div>`).join('') : '<div class="row">No lineups for that zip.</div>'}</div>` : ''}`;
        return `<p>Signed in as <b>${esc(sd.username)}</b> · lineup <b>${esc(sd.lineupName || sd.lineup)}</b>${sd.stations ? ` · ${sd.stations} channels` : ''}${when ? ` · listings through ${when}` : ''}${sd.busy ? ' · loading…' : ''}${sd.error ? ` · <b>${esc(sd.error)}</b>` : ''}</p>
          <div class="row2"><button class="btn" id="sdFix" type="button">Check the wall's numbers against the lineup</button><button class="btn" id="sdRefresh" type="button">Refresh listings now</button></div>
          <div class="row2"><button class="btn" id="sdLineupChange" type="button">Change lineup</button><button class="btn danger" id="sdForget" type="button">Sign out</button></div>
          ${sdNote ? `<div class="lbl" style="text-transform:none;letter-spacing:0;font-size:13px">${sdNote}</div>` : ''}`; })()}
    </div>
    <div><button class="btn" id="showLog" type="button">Bridge log</button> <span class="lbl">What the bridge has been doing: connections dropping, errors, timers. Send a screenshot of this when something misbehaves.</span></div>
    <pre class="log" id="bridgeLog" hidden></pre>
    <div><button class="btn" id="updateBridge" type="button">Update the bridge</button> <span class="lbl" id="updateOut">${standalone ? '' : `Running version ${esc(state.version || '?')} · ${pushLog.length} updates in the last minute${state.lineup ? ` · lineup ${esc(state.lineup.replace('.json', ''))}` : ''}. Pulls the newest version and restarts (about a minute).`}</span></div>
    <div class="row2"><span></span><button class="btn pri" id="closeSheet" type="button">Done</button></div>
  </div></div>`;
}

// ---------- events ------------------------------------------------------------
setInterval(() => { const b = box(); if (b && b.sleepAt) render(); }, 30000);
let repeatTimer = null, repeatKey = null;
function stopRepeat() { clearInterval(repeatTimer); clearTimeout(repeatTimer); repeatTimer = null; repeatKey = null; }
document.addEventListener('pointerdown', (e) => {
  const k = e.target.closest('[data-key][data-repeat]'); if (!k) return;
  repeatKey = k.dataset.key;
  repeatTimer = setTimeout(() => { repeatTimer = setInterval(() => sendKey(repeatKey), 180); }, 450);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => document.addEventListener(ev, stopRepeat));

document.addEventListener('click', (e) => {
  const t = e.target;
  const btn = (sel) => t.closest(sel);
  let el;
  if ((el = btn('[data-key]'))) return sendKey(el.dataset.key);
  if (btn('#sleepBtn') || btn('#sleepQuick')) {
    const b = box(); if (!b) return;
    const running = b.sleepAt && b.sleepAt > Date.now();
    return api(`/api/box/${b.id}/sleep`, running ? { cancel: true } : { minutes: 90 }).then((r) => toast(running ? 'Timer cancelled' : `${b.name} turns off at ${new Date(r.sleepAt).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`, 4000)).catch((err) => toast(err.message, 5000));
  }
  if ((el = btn('[data-plug]'))) {
    const on = el.dataset.on !== '1'; el.dataset.on = on ? 1 : 0; el.classList.toggle('live', on); $('.show', el).textContent = on ? 'Turning on…' : 'Turning off…';
    return api(`/api/plugs/${el.dataset.plug}`, { on }).catch((err) => { toast(err.message, 5000); render(); });
  }
  if ((el = btn('[data-stat]'))) {
    const id = el.dataset.stat, act = el.dataset.act;
    const body = act === 'bump' ? { bump: { which: el.dataset.which, delta: Number(el.dataset.delta) } } : act === 'mode' ? { mode: Number(el.dataset.v) } : act === 'fan' ? { fan: Number(el.dataset.v) } : { hold: Number(el.dataset.v) };
    if (act === 'bump') { const v = $('.stval', el.parentElement); if (v) v.style.opacity = '.5'; }
    return api(`/api/thermostats/${id}`, body).then((r) => { const i = (state.thermostats || []).findIndex((t) => t.id === id); if (i >= 0 && r.thermostat) { state.thermostats[i] = r.thermostat; render(); } }).catch((err) => { toast(err.message, 5000); render(); });
  }
  if ((el = btn('[data-hp]'))) { const b = box(); if (!b) return; return api(`/api/box/${b.id}/headphone`, { dir: el.dataset.hp }).catch((err) => toast(err.message, 5000)); }
  if ((el = btn('[data-digit]'))) return pressDigit(el.dataset.digit);
  if (btn('[data-clear]')) { entry = ''; clearTimeout(entryTimer); $('#entry').innerHTML = '&nbsp;'; return; }
  if (btn('[data-go]')) return goEntry();
  if ((el = btn('[data-box]'))) { current = el.dataset.box; try { localStorage.setItem('or.box', current); } catch {} return render(); }
  if ((el = btn('[data-tab]'))) { if (editing) { commitEdits(); editing = false; } tab = el.dataset.tab; try { localStorage.setItem('or.tab', tab); } catch {} return render(); }
  if (btn('#editBtn')) { if (editing) commitEdits(); editing = !editing; return render(); }
  if (btn('#importBtn')) { commitEdits(); sheet = 'import'; return render(); }
  if (btn('#importCancel')) { sheet = null; return render(); }
  if (btn('#importGo')) { const list = parseLineup($('#lineupText').value); if (!list.length) return toast('Nothing I could read. One channel per line, with its number.'); const rep = $('#lineupReplace').checked; sheet = null; return applyLineup(list, rep).then(render); }
  if ((el = btn('[data-lineup]'))) {
    const rep = $('#lineupReplace').checked;
    return fetch(`lineups/${el.dataset.lineup}`).then((r) => r.json()).then((j) => { sheet = null; return applyLineup(j.channels || [], rep).then(render); }).catch((err) => toast(`Could not load that lineup: ${err.message}`));
  }
  if ((el = btn('[data-fav]'))) {
    e.stopPropagation(); const c = state.channels[+el.dataset.fav];
    if (person) { const p = personRec(); if (p) { const k = norm0(c.name); p.favs = p.favs.some((f) => norm0(f) === k) ? p.favs.filter((f) => norm0(f) !== k) : [...p.favs, c.name]; render(); return saveConfig({ people: state.people }); } }
    c.fav = !c.fav; if (editing) return render(); return saveConfig({ channels: state.channels });
  }
  if ((el = btn('[data-person]'))) { person = el.dataset.person; try { localStorage.setItem('or.person', person); } catch {} return render(); }
  if (btn('#personAddBtn')) { personAdding = true; return render(); }
  if (btn('#personAddGo')) {
    const name = ($('#personName') || {}).value.trim(); if (!name) return toast('Type a name');
    const people = [...(state.people || []), { id: '', name, favs: [], shows: [] }]; personAdding = false;
    return saveConfig({ people }).then(() => { const p = (state.people || []).find((x) => x.name === name); if (p) { person = p.id; try { localStorage.setItem('or.person', person); } catch {} render(); } });
  }
  if (btn('#personAddCancel')) { personAdding = false; showAdding = false; return render(); }
  if ((el = btn('[data-person-del]'))) { const people = (state.people || []).filter((p) => p.id !== el.dataset.personDel); if (person === el.dataset.personDel) person = ''; return saveConfig({ people }); }
  if (btn('#showAddBtn')) { showAdding = true; return render(); }
  if (btn('#showAddGo')) {
    const name = ($('#showName') || {}).value.trim(); if (!name) return toast('Type the show\'s name');
    const p = personRec(); if (!p) return toast('Pick a person first'); p.shows = [...(p.shows || []), name]; showAdding = false; return saveConfig({ people: state.people });
  }
  if ((el = btn('[data-show-del]'))) { e.stopPropagation(); const p = personRec(); if (!p) return; p.shows = (p.shows || []).filter((x) => x !== el.dataset.showDel); return saveConfig({ people: state.people }); }
  if ((el = btn('[data-show]'))) {
    const info = showInfo[el.dataset.show] && showInfo[el.dataset.show].data; const hit = info && (info.now[0] || info.next[0]);
    if (!hit) return toast(`${el.dataset.show} is not on any of your channels today`, 4000);
    if (!info.now[0]) toast(`${el.dataset.show} starts ${fmtWhen(hit.start)} on ${hit.channel}. Putting that channel on.`, 5000);
    return tune(hit.number);
  }
  if ((el = btn('[data-del]'))) { commitEdits(); state.channels.splice(+el.dataset.del, 1); return render(); }
  if (btn('#addCh')) { commitEdits(); state.channels.push({ name: '', number: null, groups: [tab === 'all' || tab === 'fav' ? 'entertainment' : tab], fav: tab === 'fav' }); return render(); }
  if ((el = btn('[data-tune]'))) return tune(el.dataset.tune);
  if ((el = btn('[data-app]'))) {
    const x = box(); if (!x) return toast('Add a room first');
    const a = state.apps.find((q) => q.id === el.dataset.app);
    toast(`Opening ${a ? a.name : 'app'} on ${x.name}…`, 1500);
    return api(`/api/box/${x.id}/app`, { app: el.dataset.app }).catch((err) => toast(err.message));
  }
  if (btn('#gearBtn')) { sheet = 'setup'; return render(); }
  if (btn('#moreBtn')) { $('#pad').classList.add('open'); return; }
  if (btn('#closePad')) { $('#pad').classList.remove('open'); return; }
  if ((el = btn('[data-tvedit]'))) { tvEdit = tvEdit === el.dataset.tvedit ? null : el.dataset.tvedit; return renderSheet(); }

  }

    const id = tvEdit;

  if (btn('#closeSheet')) { sheet = null; return render(); }
  if (btn('#sdSignin')) {
    const body = { username: $('#sdUser').value.trim(), password: $('#sdPass').value };
    if (!body.username || !body.password) return toast('The Schedules Direct username and password, please');
    toast('Signing in…', 3000);
    return api('/api/sd/signin', body).then((r) => { toast(r.lineup ? 'Signed in; loading the listings' : 'Signed in. Now pick the lineup.', 5000); sdLineups = null; return refreshState(); }).then(() => renderSheet(true)).catch((err) => toast(err.message, 8000));
  }
  if (btn('#sdFind')) {
    toast('Asking Schedules Direct…', 3000);
    return api(`/api/sd/lineups?zip=${encodeURIComponent($('#sdZip').value.trim() || '07656')}`).then((r) => { sdLineups = r.lineups || []; renderSheet(true); }).catch((err) => toast(err.message, 8000));
  }
  if ((el = btn('[data-sdlineup]'))) {
    el.disabled = true; el.textContent = 'Loading…'; toast('Loading the listings; the first time takes a minute', 6000);
    return api('/api/sd/lineup', { lineup: el.dataset.sdlineup, name: el.dataset.sdname }).then(() => { sdLineups = null; return refreshState(); }).then(() => { renderSheet(true); toast('Listings loaded', 4000); }).catch((err) => { toast(err.message, 8000); renderSheet(true); });
  }
  if (btn('#sdLineupChange')) { return api('/api/sd/forget-lineup').catch(() => null).then(() => { sdLineups = null; return refreshState(); }).then(() => renderSheet(true)); }
  if (btn('#sdRefresh')) { toast('Refreshing the listings…', 4000); return api('/api/sd/refresh').then(() => refreshState()).then(() => { renderSheet(true); toast('Listings refreshed'); }).catch((err) => toast(err.message, 8000)); }
  if (btn('#sdForget')) { return kmgConfirmLite('Sign out of Schedules Direct on the bridge? The guide goes back to the free feed.').then((ok) => { if (!ok) return; return api('/api/sd/forget').then(() => refreshState()).then(() => { sdLineups = null; renderSheet(true); }).catch((err) => toast(err.message, 8000)); }); }
  if (btn('#sdFix')) {
    sdNote = 'Checking…'; renderSheet(true);
    return api('/api/sd/check-numbers', {}).then((r) => {
      const unknown = r.unknown.length ? ` · ${r.unknown.length} not in the lineup${r.unknown.length <= 12 ? `: ${esc(r.unknown.join(', '))}` : ''}` : '';
      sdNote = !r.changes.length ? `All ${r.checked} channels on the wall match the lineup${unknown}`
        : `${r.changes.length} of ${r.checked} differ: ${r.changes.slice(0, 12).map((c) => `${esc(c.name)} ${esc(c.number || '—')}→${c.lineupNumber}`).join(', ')}${r.changes.length > 12 ? '…' : ''}${unknown} <button class="btn pri" type="button" id="sdFixApply">Fix the ${r.changes.length} numbers</button>`;
      renderSheet(true);
    }).catch((err) => { sdNote = esc(err.message); renderSheet(true); });
  }
  if (btn('#sdFixApply')) {
    sdNote = 'Fixing…'; renderSheet(true);
    return api('/api/sd/check-numbers', { apply: true }).then((r) => { sdNote = `Fixed ${r.changes.length} channel numbers from the lineup`; renderSheet(true); toast(`${r.changes.length} channel numbers fixed`, 5000); }).catch((err) => { sdNote = esc(err.message); renderSheet(true); });
  }
  if (btn('#tuyaSave')) {
    const body = { accessId: $('#tuyaId').value, secret: $('#tuyaSecret').value, region: $('#tuyaRegion').value };
    if (!body.accessId || !body.secret) return toast('Paste the Access ID and the Access Secret from iot.tuya.com');
    toast('Talking to Tuya…', 3000);
    return api('/api/tuya', body).then((r) => { toast(`Tuya is connected: ${r.count} devices`, 5000); renderSheet(true); }).catch((err) => { toast(err.message, 8000); renderSheet(true); });
  }
  if (btn('#showLog')) {
    const pre = $('#bridgeLog'); pre.hidden = false; pre.textContent = 'Reading…';
    return api('/api/log').then((r) => { pre.textContent = `Rooms: ${r.rooms.map((x) => `${x.id} box=${x.box || '-'}${x.boxErr ? ' (' + x.boxErr + ')' : ''} tv=${x.tv || '-'} link=${x.link || '-'}${x.linkErr ? ' (' + x.linkErr + ')' : ''}`).join(' · ')}\nState pushes this minute: ${r.pushesThisMinute}\n\n${r.lines.join('\n')}`; pre.scrollTop = pre.scrollHeight; }).catch((err) => { pre.textContent = err.message; });
  }
  if (btn('#updateBridge')) { $('#updateOut').textContent = 'Updating… the page reconnects by itself.'; return api('/api/update', {}).then((r) => { $('#updateOut').textContent = r.message || 'Restarting…'; }).catch((err) => { $('#updateOut').textContent = `Update failed: ${err.message}. Send a screenshot of this line.`; toast(err.message, 8000); }); }
  if (btn('#pairCancel')) { const s = sheet; sheet = null; if (s && s.pair) { dismissedPair.add(s.pair + ':' + (s.target || 'box')); api(`/api/box/${s.pair}/pair/cancel`, { target: s.target || 'box' }).catch(() => {}); } return render(); }
  if (btn('#pairSend')) { const x = state.boxes.find((b) => b.id === sheet.pair); return api(`/api/box/${x.id}/code`, { code: $('#pairCode').value, target: sheet.target || 'box' }).then(() => toast('Code sent, waiting…')).catch((err) => toast(err.message)); }
  if ((el = btn('[data-pair]'))) { sheet = { pair: el.dataset.pair, target: el.dataset.target || 'box' }; return api(`/api/box/${el.dataset.pair}/pair`, { target: sheet.target }).then(render).catch((err) => toast(err.message)); }
  if ((el = btn('[data-learn]'))) { sheet = { learn: el.dataset.learn }; return render(); }
  if (btn('#closeLearn')) { sheet = 'setup'; return render(); }
  if ((el = btn('[data-irlearn]'))) { return api(`/api/box/${sheet.learn}/ir/learn`, { key: el.dataset.irlearn }).then(() => toast('Learned')).catch((err) => toast(err.message, 4000)); }
  if ((el = btn('[data-irforget]'))) { return api(`/api/box/${sheet.learn}/ir/forget`, { key: el.dataset.irforget }).catch((err) => toast(err.message)); }
  if ((el = btn('[data-focus]'))) { const x = box(); if (!x) return; return api(`/api/box/${x.id}/focus`, { focus: el.dataset.focus }).catch((err) => toast(err.message)); }
  if ((el = btn('[data-reconnect]'))) return api(`/api/box/${el.dataset.reconnect}/reconnect`).catch((err) => toast(err.message));
  if ((el = btn('[data-rmbox]'))) return saveConfig({ boxes: state.boxes.filter((b) => b.id !== el.dataset.rmbox).map(({ id, name, host }) => ({ id, name, host })) });
  if ((el = btn('[data-nbbrand]'))) { el.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === el)); return; }
  if (btn('#identifyStart')) { toast('Asking every TV and box… look at the screens', 4000); return api('/api/identify', {}).then(() => renderSheet(true)).catch((err) => toast(err.message)); }
  if (btn('#identifyStop')) { return kmgConfirmLite('Start over? This closes the codes on every TV and forgets the TV and box picked for this room.').then((ok) => { if (!ok) return; return api('/api/identify/stop', {}).then(() => { if (state.identify) state.identify = null; renderSheet(true); }); }).catch((err) => toast(err.message)); }
  if (btn('#idCodeSend')) {
    const code = ($('#idCode') || {}).value || ''; idCodeDraft = '';
    toast('Checking that code against every box…', 3000);
    return api('/api/identify/code', { code }).then((r) => {
      fillFromIdentify(r);
    }).catch((err) => toast(err.message, 6000));
  }
  if ((el = btn('[data-idpoke]'))) {
    toast('Watch the TVs… one of them is about to show the box\'s Home screen', 4000);
    return api('/api/identify/poke', { host: el.dataset.idpoke }).then((r) => toast(r.message, 6000)).catch((err) => toast(err.message, 6000));
  }
  if ((el = btn('[data-idpick]'))) {
    return api('/api/identify/pick', { host: el.dataset.idpick }).then((r) => fillFromIdentify(r)).catch((err) => toast(err.message, 6000));
  }
  if ((el = btn('[data-idtv]'))) { fillFromIdentify({ host: el.dataset.idtv, kind: 'samsung-tv' }); return; }
  if ((el = btn('[data-nbtype]'))) {
    el.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === el));
    const t = el.dataset.nbtype; const h = $('#nbHost'); h.disabled = t === 'none';
    h.placeholder = { none: 'No box in this room', androidtv: 'Box IP (192.168.1.50)', directv: 'Genie IP (192.168.1.70)', ir: 'Blaster IP (192.168.1.80) — tap Find to list blasters' }[t]; return;
  }
  if (btn('#nbAdd')) {
    const name = $('#nbName').value.trim(); const boxType = ($('#nbType .on') || {}).dataset ? $('#nbType .on').dataset.nbtype : 'androidtv';
    const host = boxType === 'none' ? '' : $('#nbHost').value.trim();
    const brand = ($('#nbBrand .on') || {}).dataset ? $('#nbBrand .on').dataset.nbbrand : '', tvHost = $('#nbTvHost').value.trim();
    if (!name) return toast('Give the room a name');
    if (boxType !== 'none' && !host) return toast(boxType === 'ir' ? 'Type the blaster IP address' : 'Type the box IP address');
    if (brand && !tvHost) return toast('Type the TV IP address');
    if (!host && !brand) return toast('A room needs a cable box or a TV');
    const found = (discoverCache.blasters || []).find((q) => q.host === host);
    const rooms = [...state.boxes.map(({ id, name: n, host: h, boxType: bt }) => ({ id, name: n, host: h, boxType: bt })), { name, host, boxType, ...(boxType === 'ir' && found ? { ir: { mac: found.mac, devType: found.devType } } : {}) }];
    return api('/api/config', { boxes: rooms }).then((st) => {
      applyState(st);
      const room = st.boxes[st.boxes.length - 1];
      if (!brand) return toast('Room added');
      return api(`/api/box/${room.id}/tv`, { brand, host: tvHost, route: 'tv', frame: $('#nbFrame').checked, ...($('#nbPsk').value ? { psk: $('#nbPsk').value } : {}) })
        .then((st2) => { applyState(st2); toast(brand === 'samsung' ? 'Room added. Tap Allow on TV, then Allow on the set.' : 'Room added'); });
    }).catch((err) => toast(err.message));
  }
  if (btn('#statSave')) {
    const rows = [...document.querySelectorAll('[data-statrow]')].map((r) => ({ id: r.dataset.id || undefined, name: $('.stName', r).value.trim(), host: $('.stHost', r).value.trim() })).filter((r) => r.host);
    const thermostats = rows.map((r) => ({ id: r.id, name: r.name || r.host, host: r.host }));
    return saveConfig({ thermostats }).then(() => { toast(thermostats.length ? `${thermostats.length} thermostat${thermostats.length === 1 ? '' : 's'} saved; connecting now` : 'No thermostats'); renderSheet(true); });
  }
  if (btn('#statScan')) {
    $('#statScanOut').textContent = 'Looking on the Wi-Fi… about 10 seconds';
    return api('/api/thermostats/scan').then((r) => {
      const out = $('#statScanOut'); if (!out) return;
      const found = (r.found || []);
      out.innerHTML = found.length ? `Found: ${found.map((f) => `<button class="btn" type="button" data-statadd="${esc(f.host)}" data-statname="${esc(f.name || '')}">${esc(f.name || 'Thermostat')} · ${esc(f.host)}</button>`).join(' ')}` : `Nothing new answered on ${esc((r.networks || []).join(', ') || 'the Wi-Fi')}${(r.already || []).length ? ` (${r.already.length} already set up)` : ''}. A thermostat only answers after its Connection Type is set to Automation.`;
    }).catch((err) => { const out = $('#statScanOut'); if (out) out.textContent = err.message; });
  }
  if ((el = btn('[data-statadd]'))) {
    const rows = [...document.querySelectorAll('[data-statrow]')]; let row = rows.find((r) => !$('.stHost', r).value.trim());
    if (!row) { row = rows[rows.length - 1].cloneNode(true); $('.stName', row).value = ''; $('.stHost', row).value = ''; $('#statRows').appendChild(row); }
    $('.stHost', row).value = el.dataset.statadd; if (!$('.stName', row).value) $('.stName', row).value = el.dataset.statname;
    el.disabled = true; toast('Added; press Save thermostats');
    return;
  }
  if (btn('#discover')) {
    $('#discoverOut').textContent = 'Looking…';
    return api('/api/discover').then((r) => {
      discoverCache = r;
      const parts = [...r.found.map((f) => `${f.name} at ${f.host}`), ...(r.tvs || []).map((t) => `${t.brand === 'sony' ? 'Sony' : 'Samsung'} TV at ${t.host}`), ...(r.blasters || []).map((q) => `${q.model} blaster at ${q.host}`)];
      $('#discoverOut').textContent = parts.length ? parts.join(' · ') : 'None answered. Check everything is on and on the same Wi-Fi.';
      if (r.found[0]) $('#nbHost').value = r.found[0].host;
    }).catch((err) => { $('#discoverOut').textContent = err.message; });
  }
  if ((el = btn('[data-enter]'))) return saveConfig({ channelEnter: el.dataset.enter });
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'pairCode') $('#pairSend').click(); if (e.key === 'Enter' && e.target.id === 'idCode') $('#idCodeSend').click(); });
document.addEventListener('input', (e) => { if (e.target.id === 'idCode') idCodeDraft = e.target.value; });
const GROUP_WORDS = [[/news|cnn|msnbc|cnbc|bloomberg|fox news|newsmax|weather|c-span|cspan|bbc/i, 'news'], [/espn|sports|golf|nfl|nba|mlb|nhl|yes|sny|msg|tennis|fs1|fs2|nbcsn|cbs sports|bally|tnt sports|motortrend/i, 'sports'],
  [/disney|nick|cartoon|boomerang|pbs kids|universal kids|baby|sprout|discovery family/i, 'kids'], [/hbo|max|showtime|starz|cinemax|tcm|movie|flix|epix|mgm|sundance|ifc|amc|fxm|hallmark movies/i, 'movies']];
function groupsFor(name) { const g = GROUP_WORDS.filter(([rx]) => rx.test(name)).map(([, grp]) => grp); return g.length ? g : ['entertainment']; }
function parseLineup(text) {
  const out = [];
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.replace(/\s+/g, ' ').trim(); if (!line) continue;
    let m = line.match(/^(\d{1,4})\s*[-–:.)]?\s+(.+)$/) || line.match(/^(.+?)\s*[-–:.]?\s+(\d{1,4})$/);
    if (!m) continue;
    const num = Number(/^\d/.test(m[1]) ? m[1] : m[2]); const name = (/^\d/.test(m[1]) ? m[2] : m[1]).replace(/\s*\((HD|SD)\)\s*$/i, '').replace(/\s+HD$/i, '').trim();
    if (!name || !num) continue;
    out.push({ name, number: num });
  }
  return out;
}
function applyLineup(list, replace) {
  const norm = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
  const existing = replace ? [] : state.channels.slice();
  const favs = new Set(state.channels.filter((c) => c.fav).map((c) => norm(c.name)));
  let filled = 0, added = 0;
  for (const c of list) {
    const hit = existing.find((e) => norm(e.name) === norm(c.name));
    if (hit) { hit.number = c.number; if (c.guide && !hit.guide) hit.guide = c.guide; filled++; }
    else { existing.push({ name: c.name, number: c.number, groups: Array.isArray(c.groups) && c.groups.length ? c.groups : groupsFor(c.name), fav: favs.has(norm(c.name)), ...(c.guide ? { guide: c.guide } : {}) }); added++; }
  }
  state.channels = existing;
  return saveConfig({ channels: state.channels }).then(() => toast(`${filled} numbers filled in, ${added} channels added`, 4000));
}
function commitEdits() {
  document.querySelectorAll('.tile.editing').forEach((tile) => {
    const c = state.channels[+tile.dataset.i]; if (!c) return;
    c.name = $('[data-field=name]', tile).value.trim() || c.name;
    const n = $('[data-field=number]', tile).value.replace(/\D/g, '');
    c.number = n ? Number(n) : null;
  });
  state.channels = state.channels.filter((c) => c.name);
  saveConfig({ channels: state.channels });
}
document.addEventListener('focusout', (e) => { if (editing && e.target.matches('.tile.editing input')) { /* kept until Done */ } });

// keep the screen on while the remote is open (best effort)
try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch {}
boot();
})();
