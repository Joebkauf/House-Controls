<title>House Controls</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a TV-guide wall. Left rail = which TV + what's on; centre = channel
   tiles under category tabs; right pad = the few buttons a remote really needs.
   Dark-first (it is used on a couch with the lights down); light theme for daytime. */
:root {
  --bg: #121820;          /* night slate */
  --panel: #1a2230;       /* rail + pad */
  --tile: #222c3b;        /* channel tile */
  --tile-hi: #2b3748;     /* pressed / hover */
  --line: #2f3b4d;
  --fg: #f3efe7;          /* warm off-white */
  --muted: #9aa6b8;
  --accent: #f0b35a;      /* amber: what is on, what is live */
  --accent-ink: #1a1408;
  --ok: #58c28a;
  --warn: #e8a042;
  --bad: #e5655f;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ece9e2; --panel: #f7f5f0; --tile: #ffffff; --tile-hi: #f1ede4; --line: #d8d3c8;
    --fg: #1c2230; --muted: #5d6676; --accent: #b8741a; --accent-ink: #fff8ec;
    --ok: #2f9a63; --warn: #b96f12; --bad: #c4443f; --shadow: 0 8px 24px rgba(40,30,10,.12);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #ece9e2; --panel: #f7f5f0; --tile: #ffffff; --tile-hi: #f1ede4; --line: #d8d3c8;
  --fg: #1c2230; --muted: #5d6676; --accent: #b8741a; --accent-ink: #fff8ec;
  --ok: #2f9a63; --warn: #b96f12; --bad: #c4443f; --shadow: 0 8px 24px rgba(40,30,10,.12);
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.35 var(--body);
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.app { height: 100%; display: grid; gap: 14px; grid-template-columns: 180px minmax(0,1fr) 230px; grid-template-rows: minmax(0,1fr); }

/* rail */
.rail { background: var(--panel); border-radius: 18px; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.brand { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.brand small { font: 500 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.boxes { display: flex; flex-direction: column; gap: 6px; }
.box { text-align: left; border-radius: 12px; padding: 10px 12px; border: 1px solid transparent; display: grid; gap: 3px; }
.box.on { background: var(--tile); border-color: var(--line); }
.box .nm { font-family: var(--display); font-size: 19px; font-weight: 600; }
.box .st { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ready { background: var(--ok); } .dot.pairing, .dot.connecting { background: var(--warn); } .dot.offline, .dot.needs-pairing { background: var(--bad); }
.now { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; }
.now .lbl, .lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.now .big { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1.05; }
.now .sub { color: var(--muted); font-size: 13px; }
.rail .gear { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 6px 0; display: flex; gap: 6px; align-items: center; }
.rail .gear:hover { color: var(--fg); }

/* centre */
.main { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
.tabs { display: flex; gap: 4px; align-items: center; overflow-x: auto; scrollbar-width: none; flex: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 10px 14px; border-radius: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; color: var(--muted); white-space: nowrap; }
.tab.on { color: var(--fg); background: var(--panel); box-shadow: inset 0 -3px 0 var(--accent); }
.tabs .sp { flex: 1; }
.tab.edit { color: var(--accent); }
.tab.edit.on { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.grid { overflow-y: auto; display: grid; grid-auto-rows: max-content; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; align-content: start; padding: 2px 2px 8px; min-height: 0; }
.tile { position: relative; background: var(--tile); border-radius: 16px; min-height: 116px; padding: 14px 14px 12px; display: grid; grid-template-rows: 1fr auto; gap: 6px; text-align: left; box-shadow: var(--shadow); border: 2px solid transparent; transition: transform .08s ease, background .08s ease; }
.tile:active { transform: scale(.97); background: var(--tile-hi); }
.tile.live { border-color: var(--accent); }
.tile .name { font-family: var(--display); font-weight: 700; font-size: clamp(22px, 2.4vw, 30px); line-height: .95; letter-spacing: .01em; text-wrap: balance; align-self: start; padding-right: 26px; }
.tile .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile.branded { display: flex; flex-direction: column; gap: 6px; background: linear-gradient(140deg, color-mix(in srgb, var(--bc) 30%, var(--tile)) 0%, var(--tile) 75%); box-shadow: inset 0 3px 0 var(--bc), var(--shadow); }
.tile .desc { font-size: 11.5px; line-height: 1.3; color: var(--muted); padding-right: 26px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile.branded > * { flex-shrink: 0; }
.tile.branded .meta { margin-top: auto; }
.tile .chip { display: flex; align-items: center; gap: 7px; min-width: 0; }
.tile .logo { width: 22px; height: 22px; border-radius: 5px; flex: none; }
.tile.apptile .logo { width: 26px; height: 26px; }
.tile .num { font-family: var(--display); font-size: 16px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile .num.none { color: var(--warn); font-family: var(--body); font-size: 12px; font-weight: 600; }
.tile .onnow { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.tile .fav { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; line-height: 34px; text-align: center; color: var(--muted); }
.tile .fav.on { color: var(--accent); }
.tile.editing { cursor: default; }
.tile.editing input { width: 100%; box-sizing: border-box; font-size: 16px; }
.tile.editing .row { display: grid; grid-template-columns: 1fr 72px; gap: 6px; }
.tile.editing .del { color: var(--bad); font-size: 12px; font-weight: 600; justify-self: start; }
.tile.apptile { min-height: 92px; grid-template-rows: 1fr auto; }
.tile.apptile .name { font-size: clamp(24px, 2.6vw, 32px); padding-right: 0; }
.tile.apptile .meta .num { font-family: var(--body); font-size: 12px; font-weight: 600; }
.tile.apptile.na { opacity: .45; }
.tile.add { place-items: center; border: 2px dashed var(--line); background: transparent; box-shadow: none; color: var(--muted); font-weight: 600; }
.empty { color: var(--muted); padding: 30px 8px; grid-column: 1 / -1; }

/* pad */
.pad { background: var(--panel); border-radius: 18px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; overflow-y: auto; }
.k { background: var(--tile); border-radius: 14px; min-height: 56px; display: grid; place-items: center; font-weight: 600; font-size: 15px; letter-spacing: .04em; box-shadow: var(--shadow); transition: transform .06s ease, background .06s ease; }
.k:active { transform: scale(.95); background: var(--tile-hi); }
.k.big { min-height: 70px; font-size: 26px; font-family: var(--display); font-weight: 700; }
.k.power { background: var(--accent); color: var(--accent-ink); }
.k.mute.on { box-shadow: inset 0 0 0 2px var(--bad); }
.k.muted-word { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.vol { display: grid; gap: 6px; }
.vol .hdr { display: flex; justify-content: space-between; align-items: baseline; }
.vol .lvl { font-family: var(--display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.vol .bar { height: 10px; border-radius: 5px; background: var(--bg); overflow: hidden; }
.vol .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s ease; }
.vol .bar.muted i { background: var(--bad); }
.vol .note { font-size: 12px; color: var(--muted); }
.k.art { font-size: 14px; }
.quick { display: none; }
.pad .closePad { display: none; }
.stack { display: grid; gap: 6px; }
.stack .lbl { padding-left: 2px; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad .k { min-height: 52px; font-family: var(--display); font-size: 24px; font-weight: 700; }
.keypad .k.go { background: var(--accent); color: var(--accent-ink); font-family: var(--body); font-size: 14px; }
.dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dpad .k { min-height: 52px; font-size: 20px; }
.dpad .blank { visibility: hidden; }
.entry { font-family: var(--display); font-size: 24px; font-weight: 700; min-height: 28px; text-align: center; color: var(--accent); font-variant-numeric: tabular-nums; }

/* sheets */
.sheet { position: fixed; inset: 0; background: rgba(8,12,18,.6); display: grid; place-items: center; padding: 16px; z-index: 20; }
.sheet > div { background: var(--panel); border-radius: 18px; padding: 20px; width: min(560px, 100%); max-height: 90%; overflow-y: auto; display: grid; gap: 14px; box-shadow: var(--shadow); box-sizing: border-box; zoom: 1.4; }
@media (max-width: 900px) { .sheet > div { zoom: 1.15; } }
@media (max-width: 640px) { .sheet > div { zoom: 1; } }
.idpanel { background: var(--bg); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.idpanel .big { font-family: var(--display); font-size: 22px; font-weight: 700; }
.idlist { display: grid; gap: 4px; font-size: 14px; }
.idlist .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.idlist .row .btn { padding: 6px 10px; font-size: 13px; }
.idlist .st { color: var(--muted); font-size: 13px; }
.idlist .st.ok { color: var(--ok); font-weight: 600; }
.sheet h2 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 700; }
.sheet h3 { margin: 10px 0 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sheet p { margin: 0; color: var(--muted); max-width: 60ch; }
.sheet .boxrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.sheet .boxrow .nm { font-weight: 600; } .sheet .boxrow .ip { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.sheet .boxrow .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.btn { background: var(--tile); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.formrow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
.code { font-family: var(--display); font-size: 34px; letter-spacing: .25em; text-align: center; text-transform: uppercase; }
.err { color: var(--bad); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); box-sizing: border-box; }
.demo-note { font-size: 12px; color: var(--warn); font-weight: 600; }
.seg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--tile); color: var(--fg); }
.seg.wrap { flex-wrap: wrap; }
.focus { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px; align-items: center; }
.focus .k { min-height: 40px; font-size: 13px; }
.focus .k.on { box-shadow: inset 0 0 0 2px var(--accent); }
.learnrow { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.learnrow .ok { color: var(--ok); font-weight: 700; }
.learnrow .todo { color: var(--muted); }
.learning { background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 12px 14px; font-weight: 600; }

@media (max-width: 1000px) {
  .app { grid-template-columns: minmax(0,1fr) 210px; grid-template-rows: auto minmax(0,1fr); }
  .rail { grid-column: 1 / -1; flex-direction: row; align-items: center; flex-wrap: wrap; padding: 10px 14px; }
  .boxes { flex-direction: row; flex-wrap: wrap; }
  .now { margin: 0 0 0 auto; border: 0; padding: 0; text-align: right; }
  .now .big { font-size: 20px; }
}
@media (max-width: 640px) {
  .app { grid-template-columns: minmax(0,1fr); grid-template-rows: auto minmax(0,1fr) auto; }
  .quick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: var(--panel); border-radius: 18px; padding: 10px; }
  .quick .k { min-height: 54px; font-size: 18px; font-family: var(--display); font-weight: 700; box-shadow: none; }
  .quick .k.power { font-size: 20px; }
  .quick .k.more { font-family: var(--body); font-size: 13px; font-weight: 600; }
  .pad { display: none; }
  .pad.open { display: grid; position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; max-height: 88%; border-radius: 22px 22px 0 0;
    grid-template-columns: 1fr 1fr; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -12px 40px rgba(0,0,0,.45); }
  .pad .closePad { display: grid; grid-column: 1 / -1; min-height: 44px; }
  .pad .power, .pad .vol, .pad .row3, .pad .stack { grid-column: 1 / -1; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .tile .name { font-size: 20px; }
  .now { width: 100%; text-align: left; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app" id="app">
  <aside class="rail">
    <div class="brand"><span>House</span><small>controls</small></div>
    <div class="boxes" id="boxes"></div>
    <div class="now" id="now"></div>
    <button class="gear" id="gearBtn" type="button">⚙ Boxes &amp; setup</button>
  </aside>

  <section class="main">
    <nav class="tabs" id="tabs"></nav>
    <div class="grid" id="grid"></div>
  </section>

  <div class="quick" id="quick">
    <button class="k power" data-key="POWER" type="button" aria-label="Power">⏻</button>
    <button class="k" data-key="VOLUME_DOWN" data-repeat="1" type="button" aria-label="Volume down">−</button>
    <button class="k" data-key="VOLUME_UP" data-repeat="1" type="button" aria-label="Volume up">+</button>
    <button class="k" data-key="MUTE" type="button" aria-label="Mute">🔇</button>
    <button class="k" data-key="CHANNEL_DOWN" data-repeat="1" type="button" aria-label="Channel down">CH∨</button>
    <button class="k" data-key="CHANNEL_UP" data-repeat="1" type="button" aria-label="Channel up">CH∧</button>
    <button class="k more" id="moreBtn" type="button">More</button>
  </div>

  <aside class="pad" id="pad">
    <button class="k closePad" id="closePad" type="button">Close ▾</button>
    <button class="k big power" data-key="POWER" type="button">⏻ Power</button>
    <div class="focus" id="focus" hidden><span class="lbl">Keys go to</span><button class="k" data-focus="box" type="button">Box</button><button class="k" data-focus="tv" type="button">TV</button></div>
    <div class="vol">
      <div class="hdr"><span class="lbl" id="volFrom">Volume</span><span class="lvl" id="volLvl">–</span></div>
      <div class="bar" id="volBar"><i></i></div>
      <span class="note" id="volNote" hidden></span>
    </div>
    <div class="row2">
      <button class="k big" data-key="VOLUME_DOWN" data-repeat="1" type="button">−</button>
      <button class="k big" data-key="VOLUME_UP" data-repeat="1" type="button">+</button>
    </div>
    <button class="k mute" id="muteBtn" data-key="MUTE" type="button">Mute</button>
    <div class="row2">
      <button class="k big" data-key="CHANNEL_DOWN" data-repeat="1" type="button">CH ∨</button>
      <button class="k big" data-key="CHANNEL_UP" data-repeat="1" type="button">CH ∧</button>
    </div>
    <div class="row3">
      <button class="k" data-key="LAST_CHANNEL" type="button">Last</button>
      <button class="k" data-key="GUIDE" type="button">Guide</button>
      <button class="k" data-key="CAPTIONS" type="button">CC</button>
    </div>
    <div class="row3">
      <button class="k" data-key="BACK" type="button">Back</button>
      <button class="k" data-key="HOME" type="button">Home</button>
      <button class="k" data-key="MEDIA_PLAY_PAUSE" type="button">Play ⏯</button>
    </div>
    <div class="stack">
      <span class="lbl">Type a channel</span>
      <div class="entry" id="entry">&nbsp;</div>
      <div class="keypad" id="keypad"></div>
    </div>
    <div class="stack">
      <span class="lbl">Navigate</span>
      <div class="dpad">
        <span class="k blank"></span><button class="k" data-key="DPAD_UP" type="button">↑</button><span class="k blank"></span>
        <button class="k" data-key="DPAD_LEFT" type="button">←</button><button class="k" data-key="DPAD_CENTER" type="button">OK</button><button class="k" data-key="DPAD_RIGHT" type="button">→</button>
        <span class="k blank"></span><button class="k" data-key="DPAD_DOWN" type="button">↓</button><span class="k blank"></span>
      </div>
    </div>
  </aside>
</div>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const GROUPS = [['apps','Apps'],['all','All channels'],['fav','Favorites'],['news','News'],['sports','Sports'],['entertainment','Entertainment'],['movies','Movies'],['kids','Kids']];
const APP_NAMES = [
  [/altice|optimum/i, 'Optimum TV'], [/netflix/i, 'Netflix'], [/youtube\.tv/i, 'YouTube TV'], [/youtube/i, 'YouTube'],
  [/amazon/i, 'Prime Video'], [/hulu/i, 'Hulu'], [/disney/i, 'Disney+'], [/hbo|max/i, 'Max'], [/peacock/i, 'Peacock'],
  [/paramount/i, 'Paramount+'], [/apple/i, 'Apple TV'], [/spotify/i, 'Spotify'], [/tvlauncher|launcher/i, 'Home screen'],
];
const appName = (pkg) => { if (!pkg) return ''; const m = APP_NAMES.find(([rx]) => rx.test(pkg)); return m ? m[1] : pkg.split('.').pop(); };

// Brand looks for the tiles: [accent color, the network's own site (its favicon is the logo), one line about it].
// Keyed by the tile's name, lowercased. A name not in here renders the plain tile, so hand-added channels still work.
const BRANDS = {
  'abc':             ['#2175d9', 'abc.com',            'Network TV · local news'],
  'cbs':             ['#0057b8', 'cbs.com',            'Network TV · NFL, 60 Min.'],
  'nbc':             ['#6e55dc', 'nbc.com',            'Network TV · Today, SNL'],
  'fox':             ['#3056d3', 'fox.com',            'Network TV · NFL, primetime'],
  'news 12':         ['#e31837', 'news12.com',         'Local NJ news & weather'],
  'cnn':             ['#cc0000', 'cnn.com',            '24-hour news'],
  'fox news':        ['#0a3e86', 'foxnews.com',        '24-hour news & opinion'],
  'msnbc':           ['#2a5db0', 'msnbc.com',          'News & political talk'],
  'cnbc':            ['#005594', 'cnbc.com',           'Markets & business news'],
  'bloomberg':       ['#2800d7', 'bloomberg.com',      'Business & market news'],
  'espn':            ['#d20a0a', 'espn.com',           'Live sports & SportsCenter'],
  'espn2':           ['#d20a0a', 'espn.com',           'More live sports'],
  'yes':             ['#003087', 'yesnetwork.com',     'Yankees & NY sports'],
  'sny':             ['#ff5910', 'sny.tv',             'Mets, Jets & NY sports'],
  'msg':             ['#ed1b2f', 'msgnetworks.com',    'Knicks & Rangers'],

  if ((el = btn('[data-allow]'))) { toast('Look at the TV and press Allow'); return api(`/api/box/${el.dataset.allow}/tv/allow`).catch((err) => toast(err.message)); }
  if (btn('#closeSheet')) { sheet = null; return render(); }
  if (btn('#updateBridge')) { $('#updateOut').textContent = 'Updating… the page reconnects by itself.'; return api('/api/update', {}).then((r) => { $('#updateOut').textContent = r.message || 'Restarting…'; }).catch((err) => { $('#updateOut').textContent = err.message; }); }
  if (btn('#pairCancel')) { const s = sheet; sheet = null; if (s && s.pair) { dismissedPair.add(s.pair + ':' + (s.target || 'box')); api(`/api/box/${s.pair}/pair/cancel`, { target: s.target || 'box' }).catch(() => {}); } return render(); }
  if (btn('#pairSend')) { const x = state.boxes.find((b) => b.id === sheet.pair); return api(`/api/box/${x.id}/code`, { code: $('#pairCode').value, target: sheet.target || 'box' }).then(() => toast('Code sent, waiting…')).catch((err) => toast(err.message)); }
  if ((el = btn('[data-pair]'))) { sheet = { pair: el.dataset.pair, target: el.dataset.target || 'box' }; return api(`/api/box/${el.dataset.pair}/pair`, { target: sheet.target }).then(render).catch((err) => toast(err.message)); }
  if ((el = btn('[data-learn]'))) { sheet = { learn: el.dataset.learn }; return render(); }
  if (btn('#closeLearn')) { sheet = 'setup'; return render(); }
  if ((el = btn('[data-irlearn]'))) { return api(`/api/box/${sheet.learn}/ir/learn`, { key: el.dataset.irlearn }).then(() => toast('Learned')).catch((err) => toast(err.message, 4000)); }
  if ((el = btn('[data-irforget]'))) { return api(`/api/box/${sheet.learn}/ir/forget`, { key: el.dataset.irforget }).catch((err) => toast(err.message)); }
  if ((el = btn('[data-focus]'))) { const x = box(); if (!x) return; return api(`/api/box/${x.id}/focus`, { focus: el.dataset.focus }).catch((err) => toast(err.message)); }
  if ((el = btn('[data-reconnect]'))) return api(`/api/box/${el.dataset.reconnect}/reconnect`).catch((err) => toast(err.message));
  if ((el = btn('[data-rmbox]'))) return saveConfig({ boxes: state.boxes.filter((b) => b.id !== el.dataset.rmbox).map(({ id, name, host }) => ({ id, name, host })) });
  if ((el = btn('[data-nbbrand]'))) { el.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === el)); return; }
  if (btn('#identifyStart')) { toast('Asking every TV and box… look at the screens', 4000); return api('/api/identify', {}).then(() => renderSheet()).catch((err) => toast(err.message)); }
  if (btn('#identifyStop')) { return api('/api/identify/stop', {}).then(() => { if (state.identify) state.identify = null; renderSheet(); }).catch((err) => toast(err.message)); }
  if (btn('#idCodeSend')) {
    const code = ($('#idCode') || {}).value || ''; idCodeDraft = '';
    toast('Checking that code against every box…', 3000);
    return api('/api/identify/code', { code }).then((r) => {
      const name = ($('#nbName') || {}).value || '';
      renderSheet();
      if ($('#nbName')) $('#nbName').value = name;
      const tb = $('#nbType [data-nbtype="androidtv"]'); if (tb) tb.click();
      if ($('#nbHost')) $('#nbHost').value = r.host;
      toast(`Box ${r.host} is this room's box, paired. Now name the room and pick its TV.`, 5000);
    }).catch((err) => toast(err.message, 6000));
  }
  if ((el = btn('[data-idtv]'))) {
    const name = ($('#nbName') || {}).value || '', host = ($('#nbHost') || {}).value || '';
    const sb = $('#nbBrand [data-nbbrand="samsung"]'); if (sb) sb.click();
    if ($('#nbTvHost')) $('#nbTvHost').value = el.dataset.idtv;
    if ($('#nbName')) $('#nbName').value = name; if ($('#nbHost')) $('#nbHost').value = host;
    toast(`TV ${el.dataset.idtv} filled in. Name the room and tap Add room.`, 4000);
    return;
  }
  if ((el = btn('[data-nbtype]'))) {
    el.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === el));
    const t = el.dataset.nbtype; const h = $('#nbHost'); h.disabled = t === 'none';
    h.placeholder = { none: 'No box in this room', androidtv: 'Box IP (192.168.1.50)', directv: 'Genie IP (192.168.1.70)', ir: 'Blaster IP (192.168.1.80) — tap Find to list blasters' }[t]; return;
  }
  if (btn('#nbAdd')) {
    const name = $('#nbName').value.trim(); const boxType = ($('#nbType .on') || {}).dataset ? $('#nbType .on').dataset.nbtype : 'androidtv';
    const host = boxType === 'none' ? '' : $('#nbHost').value.trim();
    const brand = ($('#nbBrand .on') || {}).dataset ? $('#nbBrand .on').dataset.nbbrand : '', tvHost = $('#nbTvHost').value.trim();
    if (!name) return toast('Give the room a name');
    if (boxType !== 'none' && !host) return toast(boxType === 'ir' ? 'Type the blaster IP address' : 'Type the box IP address');
    if (brand && !tvHost) return toast('Type the TV IP address');
    if (!host && !brand) return toast('A room needs a cable box or a TV');
    const found = (discoverCache.blasters || []).find((q) => q.host === host);
    const rooms = [...state.boxes.map(({ id, name: n, host: h, boxType: bt }) => ({ id, name: n, host: h, boxType: bt })), { name, host, boxType, ...(boxType === 'ir' && found ? { ir: { mac: found.mac, devType: found.devType } } : {}) }];
    return api('/api/config', { boxes: rooms }).then((st) => {
      applyState(st);
      const room = st.boxes[st.boxes.length - 1];
      if (!brand) return toast('Room added');
      return api(`/api/box/${room.id}/tv`, { brand, host: tvHost, route: 'tv', frame: $('#nbFrame').checked, ...($('#nbPsk').value ? { psk: $('#nbPsk').value } : {}) })
        .then((st2) => { applyState(st2); toast(brand === 'samsung' ? 'Room added. Tap Allow on TV, then Allow on the set.' : 'Room added'); });
    }).catch((err) => toast(err.message));
  }
  if (btn('#discover')) {
    $('#discoverOut').textContent = 'Looking…';
    return api('/api/discover').then((r) => {
      discoverCache = r;
      const parts = [...r.found.map((f) => `${f.name} at ${f.host}`), ...(r.tvs || []).map((t) => `${t.brand === 'sony' ? 'Sony' : 'Samsung'} TV at ${t.host}`), ...(r.blasters || []).map((q) => `${q.model} blaster at ${q.host}`)];
      $('#discoverOut').textContent = parts.length ? parts.join(' · ') : 'None answered. Check everything is on and on the same Wi-Fi.';
      if (r.found[0]) $('#nbHost').value = r.found[0].host;
    }).catch((err) => { $('#discoverOut').textContent = err.message; });
  }
  if ((el = btn('[data-enter]'))) return saveConfig({ channelEnter: el.dataset.enter });
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'pairCode') $('#pairSend').click(); if (e.key === 'Enter' && e.target.id === 'idCode') $('#idCodeSend').click(); });
document.addEventListener('input', (e) => { if (e.target.id === 'idCode') idCodeDraft = e.target.value; });
const GROUP_WORDS = [[/news|cnn|msnbc|cnbc|bloomberg|fox news|newsmax|weather|c-span|cspan|bbc/i, 'news'], [/espn|sports|golf|nfl|nba|mlb|nhl|yes|sny|msg|tennis|fs1|fs2|nbcsn|cbs sports|bally|tnt sports|motortrend/i, 'sports'],
  [/disney|nick|cartoon|boomerang|pbs kids|universal kids|baby|sprout|discovery family/i, 'kids'], [/hbo|max|showtime|starz|cinemax|tcm|movie|flix|epix|mgm|sundance|ifc|amc|fxm|hallmark movies/i, 'movies']];
function groupsFor(name) { const g = GROUP_WORDS.filter(([rx]) => rx.test(name)).map(([, grp]) => grp); return g.length ? g : ['entertainment']; }
function parseLineup(text) {
  const out = [];
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.replace(/\s+/g, ' ').trim(); if (!line) continue;
    let m = line.match(/^(\d{1,4})\s*[-–:.)]?\s+(.+)$/) || line.match(/^(.+?)\s*[-–:.]?\s+(\d{1,4})$/);
    if (!m) continue;
    const num = Number(/^\d/.test(m[1]) ? m[1] : m[2]); const name = (/^\d/.test(m[1]) ? m[2] : m[1]).replace(/\s*\((HD|SD)\)\s*$/i, '').replace(/\s+HD$/i, '').trim();
    if (!name || !num) continue;
    out.push({ name, number: num });
  }
  return out;
}
function applyLineup(list, replace) {
  const norm = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
  const existing = replace ? [] : state.channels.slice();
  const favs = new Set(state.channels.filter((c) => c.fav).map((c) => norm(c.name)));
  let filled = 0, added = 0;
  for (const c of list) {
    const hit = existing.find((e) => norm(e.name) === norm(c.name));
    if (hit) { hit.number = c.number; filled++; }
    else { existing.push({ name: c.name, number: c.number, groups: groupsFor(c.name), fav: favs.has(norm(c.name)) }); added++; }
  }
  state.channels = existing;
  return saveConfig({ channels: state.channels }).then(() => toast(`${filled} numbers filled in, ${added} channels added`, 4000));
}
function commitEdits() {
  document.querySelectorAll('.tile.editing').forEach((tile) => {
    const c = state.channels[+tile.dataset.i]; if (!c) return;
    c.name = $('[data-field=name]', tile).value.trim() || c.name;
    const n = $('[data-field=number]', tile).value.replace(/\D/g, '');
    c.number = n ? Number(n) : null;
  });
  state.channels = state.channels.filter((c) => c.name);
  saveConfig({ channels: state.channels });
}
document.addEventListener('focusout', (e) => { if (editing && e.target.matches('.tile.editing input')) { /* kept until Done */ } });

// keep the screen on while the remote is open (best effort)
try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch {}
boot();
})();
</script>
